name: SPDR source canary

# State Street publishes the NAV history sheets this project parses. Nothing
# warns us if they move the URL or reshape the file, so this checks weekly.
# It downloads and parses only — no data is stored or committed, because the
# repository is public and the sheets are State Street's to distribute.

on:
  schedule:
    # 12:00 UTC Wednesday. Mid-week avoids Monday market holidays, so there is
    # always a recent session to check against.
    - cron: "0 12 * * 3"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python scripts/spdr_source_check.py
